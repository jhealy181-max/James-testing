    {t:'QS Higher Ed Summit: Asia Pacific 2026',date:'3–5 Nov',place:'Bali · Hybrid',domains:['mobility','institutions','innovation'],url:'https://www.qs.com/conferences/asia-pacific',type:'QS summit',year:'2026'},
    {t:'QS Higher Ed Summit: Middle East 2026',date:'22–24 Nov',place:'Abu Dhabi · Hybrid',domains:['institutions','innovation','mobility'],url:'https://www.qs.com/conferences/middle-east',type:'QS summit',year:'2026'},
    {t:'QS Reimagine Education 2026',date:'6–8 Dec',place:'London · On-site',domains:['innovation','skills'],url:'https://www.qs.com/conferences/reimagine',type:'QS conference',year:'2026'},
    {t:'Global Skills Week 2027',date:'23–25 Mar',place:'Washington, D.C. · On-site',domains:['skills','innovation'],url:'https://www.qs.com/conferences/conference-calendar',type:'QS summit',year:'2027'}
  ];
  const nav=[['home','⌂','Member home'],['domains','◈','Explore domains'],['briefings','▤','Executive briefings'],['resources','▣','Resource library'],['usecases','✦','Use cases & examples'],['groups','◎','Working groups'],['events','▦','Events & roundtables'],['membership','♛','Membership & pricing'],['profile','◉','My profile']];
  const k='qs_portal_demo_v1'; let profile={name:'Alex Taylor',role:'Director of Strategy',institution:'Imperial College London',tier:'Gold',interests:['mobility','innovation'],groups:['g7']};try{profile={...profile,...JSON.parse(localStorage.getItem(k)||'{}')}}catch{};
  const state={page:'home',domain:'all',query:'',kind:'all',audience:'all',eventType:'all'};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const save=()=>{try{localStorage.setItem(k,JSON.stringify(profile))}catch{}};
  const domain=id=>D.find(d=>d.id===id);const labels=a=>(a||[]).map(x=>domain(x)?.n).filter(Boolean);
  const tag=(s,cls='')=>`<span class="tag ${cls}">${esc(s)}</span>`;
  const tags=a=>`<div class="pill-row">${labels(a).map(x=>tag(x)).join('')}</div>`;
  const ext=(u,label='Open source ↗')=>`<a class="text-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
  const header=(label,title,sub)=>`<div class="page-header"><div class="eyebrow">${label}</div><h1 class="h1">${title}</h1><p class="intro">${sub}</p></div>`;
  const section=(title,desc,button='',target='')=>`<div class="section-head"><div><h2 class="section-title">${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${button?`<button class="text-link" data-page="${target}">${button} →</button>`:''}</div>`;
  const domainCard=d=>`<article class="card domain-card" data-domain="${d.id}" role="button" tabindex="0" aria-label="Explore ${esc(d.n)}"><span class="domain-icon">${d.icon}</span><h3>${esc(d.n)}</h3><p>${esc(d.desc)}</p><span class="text-link">Explore domain →</span></article>`;
  const briefCard=b=>`<article class="card item-card"><div class="meta">${esc(b.date)} · ${esc(b.read)}</div><h3>${esc(b.t)}</h3><p>${esc(b.d)}</p>${tags(b.domains)}<div class="bottom">${tag(b.kind,'pink')}<button class="text-link" data-detail="${b.id}">Read briefing →</button></div></article>`;
  const resourceCard=r=>`<article class="card item-card"><div>${tag(r.kind,'teal')}</div><h3>${esc(r.t)}</h3><p>${esc(r.d)}</p>${tags(r.domains)}<div class="bottom"><small class="meta">${esc(r.source)}</small>${ext(r.url)}</div></article>`;
  const useCard=u=>`<article class="card item-card"><div>${tag(u.category,'teal')} ${!u.real?tag('Illustrative example','gray'):''}</div><h3>${esc(u.t)}</h3><p>${esc(u.d)}</p><div class="meta">For ${esc(u.audience)}</div>${tags(u.domains)}<div class="bottom">${u.real?ext(u.url,'View case study ↗'):`<span class="meta">Sample catalogue entry</span>`}</div></article>`;
  const groupCard=g=>`<article class="card item-card group-card"><div>${tag(domain(g.domain).n)}</div><h3>${esc(g.t)}</h3><p>${esc(g.d)}</p><div class="meta">${esc(g.schedule)}</div><div class="coordinator"><span class="avatar">${esc(g.coord.split(' ').map(x=>x[0]).join(''))}</span><span><b>${esc(g.coord)}</b><br><small>${esc(g.role)} · Demo name</small></span></div><div class="bottom"><button class="text-link" data-contact="${g.id}">Contact coordinator →</button><button class="btn small ${profile.groups.includes(g.id)?'ghost':'primary'}" data-group="${g.id}">${profile.groups.includes(g.id)?'Joined ✓':'Join group'}</button></div></article>`;
  const eventRow=e=>`<article class="event-row"><div class="datebox"><span>${esc(e.year)}</span>${esc(e.date)}</div><div><div class="meta">${esc(e.type)} · ${esc(e.place)}</div><h3>${esc(e.t)}</h3><p>Relevant portal themes (illustrative): ${esc(labels(e.domains).join(' · '))}</p></div><div class="event-actions"><a class="btn small ghost" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Event details ↗</a><small>Book on the official QS page</small></div></article>`;
  const filterRow=(opt={})=>`<div class="filters"><input id="search" type="search" value="${esc(state.query)}" placeholder="Search titles and topics…" aria-label="Search this section"><select id="domainFilter" aria-label="Filter by domain"><option value="all">All four domains</option>${D.map(d=>`<option value="${d.id}" ${state.domain===d.id?'selected':''}>${esc(d.n)}</option>`).join('')}</select>${opt.kind?`<select id="kindFilter" aria-label="Filter by type"><option value="all">All types</option>${opt.kind.map(x=>`<option value="${esc(x)}" ${state.kind===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}${opt.audience?`<select id="audienceFilter" aria-label="Filter by audience"><option value="all">All audiences</option>${opt.audience.map(x=>`<option value="${esc(x)}" ${state.audience===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}</div>`;
  function filtered(list,searchFields=['t','d']){const q=state.query.trim().toLowerCase();return list.filter(x=>(state.domain==='all'||(x.domains||[x.domain]).includes(state.domain))&&(!q||searchFields.some(f=>String(x[f]||'').toLowerCase().includes(q))||labels(x.domains||[x.domain]).join(' ').toLowerCase().includes(q)))}
  const cards=(items,fn,cols='three')=>items.length?`<div class="grid ${cols}">${items.map(fn).join('')}</div>`:'<div class="empty">No matches. Try another search or domain.</div>';
  function home(){const recent=B.slice(0,3);const events=E.slice(0,2);return `<section class="hero"><div><div class="eyebrow">QS strategic intelligence · Member area</div><h1>Better decisions start with a wider view.</h1><p>Evidence, executive perspectives and peers across the issues shaping higher education. Your interests: ${esc(labels(profile.interests).join(' and ')||'all four domains')}.</p><div class="hero-actions"><button class="btn primary" data-page="briefings">Explore briefings →</button><button class="btn outline" data-page="profile">Personalise my view</button></div></div><div class="hero-aside"><small>Featured · Executive briefing</small><strong>${esc(B[0].t)}</strong><span>September 2026 · Sample member briefing</span><br><button class="btn light small" data-detail="b1">Preview briefing →</button></div></section>${section('Explore the four domains','Follow a theme across evidence, examples, groups and events.','View all domains','domains')}<div class="grid">${D.map(domainCard).join('')}</div>${section('Latest executive briefings','Short, decision-oriented reads across the four domains.','All briefings','briefings')}<div class="feature-grid"><div class="feature"><div class="feature-lead">${tag('New · Sample briefing','pink')}<h3>${esc(recent[0].t)}</h3><p>${esc(recent[0].d)}</p><button class="btn small" data-detail="${recent[0].id}">Read briefing →</button></div><div class="feature-list"><div class="meta">Related topics: ${esc(labels(recent[0].domains).join(' · '))}</div></div></div><div class="feature feature-list">${recent.slice(1).map(b=>`<div class="row"><small>${esc(b.date)} · ${esc(labels(b.domains).join(' / '))}</small><h4>${esc(b.t)}</h4><button class="text-link" data-detail="${b.id}">Preview →</button></div>`).join('')}<div class="row"><button class="text-link" data-page="briefings">Browse all briefings →</button></div></div></div>${section('Coming up on the QS calendar','The source calendar is live; topic matches shown here are an illustrative editorial layer.','Full events view','events')}${events.map(eventRow).join('')}${section('Your peer groups','Enduring communities, organised by domain.','Browse working groups','groups')}${cards(G.filter(g=>profile.groups.includes(g.id)).length?G.filter(g=>profile.groups.includes(g.id)):G.slice(0,2),groupCard,'two')}`}
  function domains(){return `${header('The intelligence map','Four connected domains','Move from a strategic question to relevant evidence, examples, conversations and events.') }<div class="grid two">${D.map(domainCard).join('')}</div><div class="notice">Items can sit in more than one domain. This is deliberate: AI adoption, for example, connects institutional strategy, workforce outcomes and innovation.</div>`}
  function domainPage(id){const d=domain(id);return `<div class="domain-banner"><div class="eyebrow" style="color:#ff9acb">Domain ${D.indexOf(d)+1} of 4</div><h1 class="h1">${esc(d.n)}</h1><p style="font-size:18px">${esc(d.q)}</p><p>${esc(d.desc)}</p></div><div class="pill-row">${d.topics.map(x=>tag(x)).join('')}</div>${section('Executive briefings','Sample editorial content for the member service.','All briefings','briefings')}${cards(B.filter(x=>x.domains.includes(id)).slice(0,3),briefCard)}${section('Evidence & resources','Public QS pages and relevant background material.','Resource library','resources')}${cards(R.filter(x=>x.domains.includes(id)).slice(0,3),resourceCard)}${section('Examples in practice','Real QS cases are linked; illustrative ideas are labelled.','Use-case library','usecases')}${cards(U.filter(x=>x.domains.includes(id)).slice(0,3),useCard)}${section('Peer groups','Join a continuing conversation with counterparts.','All working groups','groups')}${cards(G.filter(x=>x.domain===id),groupCard,'two')}${section('On the QS events calendar','Domain matching here is indicative; check the official agenda for specific sessions.','All events','events')}${E.filter(x=>x.domains.includes(id)).slice(0,2).map(eventRow).join('')}`}
  function briefings(){let a=filtered(B).filter(b=>state.kind==='all'||b.kind===state.kind);return `${header('Executive intelligence','Briefings & newsletters','A sample publication programme: concise, decision-oriented perspectives with topics that cut across domains.')}${filterRow({kind:['Executive briefing','Member newsletter']})}${cards(a,briefCard)}<div class="notice">The six titles and summaries above are proposed sample content for this concept. They do not claim to be published QS research.</div>`}
  function resources(){let a=filtered(R).filter(x=>state.kind==='all'||x.kind===state.kind);return `${header('Knowledge base','Resource library','Find frameworks, case studies, video highlights and background links by domain or format.')}${filterRow({kind:[...new Set(R.map(x=>x.kind))]})}${cards(a,resourceCard)}<div class="notice">These entries link to public source pages. A production portal could ingest and permission full recordings, slides and member-only documents.</div>`}
  function usecases(){let a=filtered(U,['t','d','category','audience']).filter(x=>state.audience==='all'||x.audience===state.audience);return `${header('Ideas in practice','Use cases & examples','Find a problem, a comparable approach and the audience who could act on it. Real cases link to QS; other cards show the intended library structure.')}${filterRow({audience:[...new Set(U.map(x=>x.audience))]})}${cards(a,useCard)}<div class="notice">Illustrative entries are concepts for future case studies. They are not attributed to an institution or presented as delivered outcomes.</div>`}
  function groups(){let a=filtered(G);return `${header('Peer network','Working groups','Enduring, domain-based communities. A named coordinator makes it easy to join a discussion or raise a question.')}${filterRow()}${cards(a,groupCard,'two')}<div class="notice">Working groups and coordinator names are illustrative. “Join” and “Contact” demonstrate the member flow locally; no message is sent.</div>`}
  function events(){let a=filtered(E).filter(x=>state.eventType==='all'||x.type===state.eventType);return `${header('Meet, learn, connect','Events & roundtables','Discover QS summits by your interests, then book via the official conference page. Smaller roundtables sit alongside the calendar as proposed member activities.')}${filterRow()}<div class="filters"><select id="eventType" aria-label="Event format"><option value="all">All QS formats</option>${[...new Set(E.map(x=>x.type))].map(x=>`<option ${state.eventType===x?'selected':''}>${esc(x)}</option>`).join('')}</select><a class="btn small ghost" href="https://www.qs.com/conferences/conference-calendar" target="_blank" rel="noopener noreferrer">Open full QS calendar ↗</a></div>${a.length?a.map(eventRow).join(''):'<div class="empty">No events match these filters.</div>'}${section('Member roundtables','Proposed smaller sessions connected to enduring working groups.')}<div class="grid two"><article class="card item-card"><div>${tag('Proposed · Online','pink')}</div><h3>AI & assessment leaders’ roundtable</h3><p>Bring a current assessment challenge and compare approaches with peers in the Responsible AI & assessment group.</p><div class="meta">Date to be set · Innovation & new models</div><div class="bottom"><button class="text-link" data-contact="g7">Contact group coordinator →</button></div></article><article class="card item-card"><div>${tag('Proposed · Regional','pink')}</div><h3>Student flows & market choices</h3><p>A focused, regional discussion on demand shifts, destination choices and recruitment responses.</p><div class="meta">Date to be set · Global talent & mobility</div><div class="bottom"><button class="text-link" data-contact="g1">Contact group coordinator →</button></div></article></div><div class="notice">Event dates and locations above come from QS’s conference calendar, checked 24 September 2026. Portal theme matches are indicative and should be checked against each published agenda.</div>`}
  function membership(){return `${header('Institutional access','Membership & pricing','Illustrative commercial packaging for discussion. All prices, entitlements and seat counts are placeholders.') }<div class="grid three">${[
    ['Bronze','£18,000','Evidence & content','Access to executive briefings and newsletters','Searchable resource library','Use-case and example library','Up to 10 institutional accounts'],
    ['Silver','£42,000','Content + community','Everything in Bronze','Working-group participation','Member roundtables and webinar access','Up to 25 institutional accounts'],
    ['Gold','£78,000','Full intelligence network','Everything in Silver','Illustrative pool of 10 QS event tickets','Priority roundtable places','Up to 60 institutional accounts']
  ].map((p,i)=>`<article class="card price-card ${i===2?'featured':''}">${tag(i===2?'Expanded access':'Institutional tier',i===2?'pink':'')}<h3>${p[0]}</h3><div class="price">${p[1]} <span>/ institution / year</span></div><p style="color:var(--muted);margin:0;font-size:14px">${p[2]}</p><ul>${p.slice(3).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn ${i===2?'primary':'ghost'}" data-inquiry="${p[0]}">Explore ${p[0]}</button></article>`).join('')}</div><div class="notice">Concept prices only; not a QS offer or quotation. Event-ticket applicability, governance, usage rights and seat rules would need commercial definition.</div>`}
  function profilePage(){return `${header('Your member space','My profile','Your example account at Imperial College London. Changes to the form and group memberships are saved in this browser.') }<div class="split"><div><article class="card"><div class="eyebrow">Personal profile · Demo sign-in</div><form class="profile-form" id="profileForm"><label>Full name<input name="name" required value="${esc(profile.name)}"></label><label>Job role<input name="role" required value="${esc(profile.role)}"></label><label>Institution<input name="institution" value="${esc(profile.institution)}" disabled></label><div><strong style="font-size:14px">My interests</strong><div class="check-grid" style="margin-top:8px">${D.map(d=>`<label><input type="checkbox" name="interests" value="${d.id}" ${profile.interests.includes(d.id)?'checked':''}> ${esc(d.n)}</label>`).join('')}</div></div><div><button class="btn primary" type="submit">Save preferences</button></div></form></article>${section('My working groups','Join or leave a group using the button on its card.','Explore all groups','groups')}${profile.groups.length?cards(G.filter(g=>profile.groups.includes(g.id)),groupCard,'two'):'<div class="empty">You have not joined a working group yet.</div>'}</div><aside class="side-panel"><div class="eyebrow">Institution membership</div><h3>${esc(profile.institution)}</h3><p>${tag(profile.tier+' tier','teal')}<br>Example institutional account · Membership year 2026–27</p><h3 style="margin-top:24px">Other members</h3><div class="memberlist"><div class="member"><span class="avatar">JP</span><span><strong>Jordan Price</strong><span>International Director · Gold access<br>Illustrative person</span></span></div><div class="member"><span class="avatar">SK</span><span><strong>Samira Khan</strong><span>Director of Research Strategy · Gold access<br>Illustrative person</span></span></div><div class="member"><span class="avatar">EL</span><span><strong>Ellis Lee</strong><span>Digital Transformation Lead · Gold access<br>Illustrative person</span></span></div></div><button class="text-link" data-page="membership" style="margin-top:19px">Compare membership tiers →</button></aside></div><div class="notice">This is a simulated signed-in view. There is no authentication, member directory or server-side storage in the HTML proof of concept.</div>`}
  function toast(msg){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.innerHTML='',4500)}
  function modal(title,body){document.getElementById('overlay').innerHTML=`<div class="modal-back" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-button" data-close aria-label="Close">×</button></div>${body}</section></div>`;document.querySelector('#overlay [data-close]').focus()}
  function close(){document.getElementById('overlay').innerHTML=''}
  function detail(id){let b=B.find(x=>x.id===id);if(!b)return;modal(b.t,`<div class="meta">${esc(b.kind)} · ${esc(b.date)} · ${esc(b.read)}</div>${tags(b.domains)}<p>${esc(b.d)}</p><p>This is a sample editorial entry for the proof of concept. A published briefing would contain evidence, a short analysis, implications for university leaders and links to underlying sources.</p><div class="notice">Illustrative content · No full article is available in this demo.</div>`)}
  function contact(id){let g=G.find(x=>x.id===id);if(!g)return;modal('Contact '+g.coord,`<p>Ask the coordinator about <strong>${esc(g.t)}</strong>.</p><form class="message-form" id="messageForm"><input type="hidden" name="group" value="${esc(g.id)}"><textarea name="message" required placeholder="Write your question to ${esc(g.coord)}…" aria-label="Message"></textarea><button class="btn primary" type="submit">Save sample message</button><div class="hint">Demo only: this message stays in this browser and is not sent.</div></form>`)}
  function render(){let page=state.page;const views={home,domains,briefings,resources,usecases,groups,events,membership,profile:profilePage};document.getElementById('content').innerHTML=page.startsWith('domain:')?domainPage(page.slice(7)):(views[page]||home)();document.getElementById('navigation').innerHTML=nav.map(([id,icon,label])=>`<button type="button" data-page="${id}" class="${(page===id||(page.startsWith('domain:')&&id==='domains'))?'active':''}"><span class="glyph">${icon}</span>${label}</button>`).join('');document.getElementById('breadcrumb').textContent=page.startsWith('domain:')?domain(page.slice(7)).n:nav.find(x=>x[0]===page)?.[2]||'Member home';document.getElementById('sideName').textContent=profile.name;document.getElementById('topTier').textContent=profile.tier+' member';const initials=profile.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();document.getElementById('sideInitials').textContent=initials;document.getElementById('topInitials').textContent=initials;document.title=(document.getElementById('breadcrumb').textContent)+' | QS Strategic Intelligence';}
  function navigate(page){state.page=page;state.query='';state.domain='all';state.kind='all';state.audience='all';state.eventType='all';location.hash=page;document.getElementById('sidebar').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'instant'})}
  document.addEventListener('click',e=>{const a=e.target.closest('[data-page],[data-domain],[data-detail],[data-group],[data-contact],[data-inquiry],[data-close]');if(a){if(a.dataset.page)navigate(a.dataset.page);else if(a.dataset.domain)navigate('domain:'+a.dataset.domain);else if(a.dataset.detail)detail(a.dataset.detail);else if(a.dataset.contact)contact(a.dataset.contact);else if(a.dataset.group){let id=a.dataset.group;profile.groups=profile.groups.includes(id)?profile.groups.filter(x=>x!==id):[...profile.groups,id];save();render();toast(profile.groups.includes(id)?'Joined the sample working group.':'Left the sample working group.')}else if(a.dataset.inquiry)modal('Explore '+a.dataset.inquiry,`<p>Illustrative ${esc(a.dataset.inquiry)} institutional membership. In a live portal this would open a membership enquiry or account-manager conversation.</p><button class="btn primary" data-close>Close</button>`);else if(a.hasAttribute('data-close'))close();return}if(e.target.id==='backdrop')close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-domain]')){e.preventDefault();navigate('domain:'+e.target.dataset.domain)}});
  document.getElementById('menuButton').addEventListener('click',()=>{const s=document.getElementById('sidebar'),open=s.classList.toggle('open');document.getElementById('menuButton').setAttribute('aria-expanded',String(open))});
  document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;state.query=e.target.value;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)}});
  document.addEventListener('change',e=>{if(e.target.id==='domainFilter'){state.domain=e.target.value;render()}if(e.target.id==='kindFilter'){state.kind=e.target.value;render()}if(e.target.id==='audienceFilter'){state.audience=e.target.value;render()}if(e.target.id==='eventType'){state.eventType=e.target.value;render()}});
  document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();const f=new FormData(e.target);profile.name=String(f.get('name')||'').trim();profile.role=String(f.get('role')||'').trim();profile.interests=f.getAll('interests');save();render();toast('Preferences saved in this browser.')}if(e.target.id==='messageForm'){e.preventDefault();const f=new FormData(e.target);try{localStorage.setItem('qs_portal_demo_message',JSON.stringify({group:f.get('group'),message:f.get('message')}))}catch{}close();toast('Sample message saved locally. No message was sent.')}});
  const init=decodeURIComponent(location.hash.slice(1));if(init&&([...nav.map(x=>x[0]),...D.map(x=>'domain:'+x.id)].includes(init)))state.page=init;render();
})();
</script>
